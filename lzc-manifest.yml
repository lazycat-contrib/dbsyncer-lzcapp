name: DBSyncer
package: community.lazycat.app.dbsyncer
version: 2.0.7
min_os_version: 1.3.8
description: "Open-source data synchronization middleware supporting MySQL, Oracle, SqlServer, PostgreSQL, Elasticsearch, Kafka, and more"
license: Apache-2.0
homepage: https://github.com/86dbs/dbsyncer
author: 86dbs

application:
  subdomain: dbsyncer
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://dbsyncer-app:18686/

services:
  dbsyncer-app:
    # registry.cn-hangzhou.aliyuncs.com/xhtb/dbsyncer:latest
    image: registry.lazycat.cloud/czyt/xhtb/dbsyncer:160621e04d21e98b
    environment:
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/data:/app/dbsyncer/data
      - /lzcapp/var/logs:/app/dbsyncer/logs
      - /lzcapp/var/plugins:/app/dbsyncer/plugins

locales:
  en:
    name: "DBSyncer"
    description: "Open-source data synchronization middleware supporting MySQL, Oracle, SqlServer, PostgreSQL, Elasticsearch, Kafka, and more"
  zh:
    name: "DBSyncer"
    description: "开源的数据同步中间件，支持 MySQL、Oracle、SqlServer、PostgreSQL、Elasticsearch、Kafka 等多种数据源同步"

unsupported_platforms:
  - ios
  - android
  - tvos
